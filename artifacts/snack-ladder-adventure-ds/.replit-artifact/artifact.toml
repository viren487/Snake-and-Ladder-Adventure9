kind = "design-system"
previewPath = "/snack-ladder-adventure-ds/"
title = "Snake & Ladder Adventure Design System"
description = "A reusable visual system extracted from Snake & Ladder Adventure for consistent web and mobile game interfaces, with its midnight-blue surfaces, gold controls, bright board tiles, playful typography and game-inspired icon language."
version = "1.0.0"
id = "artifacts/snack-ladder-adventure-ds"
router = "path"

[[services]]
name = "web"
paths = [ "/snack-ladder-adventure-ds/" ]
localPort = 22550

[services.development]
run = "pnpm --filter @workspace/snack-ladder-adventure-ds run dev"

[services.env]
PORT = "22550"
BASE_PATH = "/snack-ladder-adventure-ds/"
